<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparring</title>
<script src="/theme.js"></script>
</head>
<body>
<div class="sp">
  <header class="bar mono">
    <span>sparring</span>
    <span class="muted"><span id="head-line"></span><span id="head-sep" hidden> · </span><button type="button" id="theme" class="t">theme · auto</button></span>
  </header>

  <main>
    <form id="idea-form" class="ideaform">
      <label for="idea" class="mono muted">&gt;</label>
      <input id="idea" class="idea" type="text" autocomplete="off" aria-label="Write down an idea" aria-describedby="idea-error">
    </form>
    <span id="idea-error" class="mono muted idea-error" role="status" hidden></span>

    <section id="inbox-sec" class="list" aria-labelledby="inbox-h" hidden>
      <h2 id="inbox-h" class="mono muted">inbox</h2>
      <div id="inbox"></div>
    </section>

    <hr class="rule">

    <section class="list" aria-labelledby="articles-h">
      <h2 id="articles-h" class="mono muted">articles</h2>
      <div id="articles"></div>
      <p id="empty" class="mono muted" hidden>no articles yet</p>
      <button type="button" id="new-btn" class="t pill">+ new article</button>
      <form id="new" class="new mono" hidden>
        <label for="new-slug" class="muted">+ new article</label>
        <input id="new-slug" name="slug" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="slug, like closed-laptop" aria-describedby="new-error">
        <span id="new-error" class="muted" role="status"></span>
      </form>
    </section>
  </main>

  <footer class="bar mono muted">
    <span>j k move · enter open · n new · i idea</span>
    <span id="conn"></span>
  </footer>
</div>
<script type="module" src="/src/index.ts"></script>
</body>
</html>
