<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparring</title>
<script src="/theme.js"></script>
</head>
<body>
<div class="sp" id="room">
  <header class="mono head">
    <a href="/" class="muted back">← articles</a>
    <span id="slug" class="title"></span>
    <span class="spacer"></span>
    <button type="button" id="guide-btn" class="t muted guide-btn">guide</button>
    <span id="mode-tag" class="muted mode-tag" hidden></span>
    <button type="button" id="stage-btn" class="btn stage" aria-haspopup="true" aria-expanded="false" aria-controls="stage-menu">stage · <span id="stage-word"></span> ▾</button>
    <div id="stage-menu" class="menu mono" hidden></div>
  </header>

  <div id="guide-slot" class="guide-slot"></div>

  <div class="body" id="body">
    <main class="page">
      <nav class="tabs mono" aria-label="Pages of this article">
        <button type="button" class="tab off" data-leaf="dump">dump</button>
        <button type="button" class="tab off" data-leaf="brief">brief</button>
        <button type="button" class="tab on" data-leaf="article" aria-current="true">article</button>
      </nav>
      <p id="leaf-help" class="help leaf-help"></p>
      <div class="scroll" id="page-scroll">
        <div class="col">
          <div id="paras" class="paras"></div>
          <section id="quotes" class="quotes-sec" hidden>
            <h3 class="help">quoted from your dump</h3>
            <div id="aside-brief"></div>
          </section>
        </div>
      </div>
    </main>

    <aside class="coach" aria-label="Coach">
      <div class="coach-head mono"><span>coach</span><span id="coach-stage" class="muted"></span></div>
      <div id="letter" class="letter mono" hidden></div>
      <section id="quiet-block" class="quietb mono muted" aria-label="The coach is quiet" hidden></section>
      <section id="notes" class="notes" aria-label="Notes on the article" hidden>
        <div class="notes-head mono">
          <button type="button" id="notes-toggle" class="t notes-toggle" aria-expanded="true" aria-controls="notes-body"></button>
          <span class="notes-title">notes</span>
          <div id="notes-filter" class="filter"></div>
          <button type="button" id="notes-close" class="t notes-close">close</button>
        </div>
        <div id="notes-body" class="notes-body">
          <div id="notes-err" class="mono err" role="alert" hidden></div>
          <div id="notes-list" class="notes-list"></div>
        </div>
      </section>
      <div class="turns-head mono muted" aria-hidden="true">conversation</div>
      <div id="turns" class="turns" aria-live="polite"></div>
      <div class="comp-wrap">
        <div id="queued" class="queued mono muted" hidden></div>
        <div id="comp-note" class="mono err note-line" role="alert" hidden></div>
        <form class="comp" id="comp-form">
          <div id="slash" class="slash mono" role="listbox" aria-label="Commands" hidden></div>
          <textarea id="composer" rows="2" placeholder="Talk to the coach · / for commands" aria-label="Reply to the coach or type a slash command" aria-controls="slash" aria-autocomplete="list" spellcheck="true"></textarea>
          <button type="submit" class="btn primary send">send</button>
        </form>
        <p class="help comp-help">Enter sends · Shift+Enter for a new line</p>
      </div>
    </aside>

    <div id="log" class="log" role="dialog" aria-label="Transcript" hidden>
      <div class="mono muted bar"><span>full transcript, with tool calls</span><button type="button" id="log-esc" class="t act text">close</button></div>
      <div id="log-list" class="log-list" aria-live="polite"></div>
    </div>

    <div id="shelf" class="log shelf" role="dialog" aria-label="Shelf" hidden>
      <div class="mono muted bar"><span>shelf · your page from before the draft</span><button type="button" id="shelf-esc" class="t act text">close</button></div>
      <p class="help">Read-only. Select and copy what you want back into the article.</p>
      <div id="shelf-err" class="mono err" role="alert" hidden></div>
      <div id="shelf-text" class="shelf-text"></div>
    </div>
  </div>

  <footer class="foot mono muted">
    <span class="grp"><span id="words">0 words</span><span>·</span><span id="saved">saved</span><span id="quiet" class="quiet" title="The coach holds its notes. /quiet again to hear them." hidden>· quiet</span><span id="yours" class="yours" hidden></span></span>
    <span class="grp"><button type="button" id="notes-btn" class="t notes-btn" aria-controls="notes" hidden></button><button type="button" id="yours-btn" class="t yours-btn" aria-expanded="false" aria-controls="quiet-block" hidden></button><button type="button" id="shelf-btn" class="t" aria-expanded="false" aria-controls="shelf" hidden>shelf</button><button type="button" id="log-btn" class="t" aria-expanded="false" aria-controls="log">transcript</button></span>
  </footer>
</div>
<div id="iv" class="iv" hidden>
  <header class="mono iv-head">
    <a href="/" class="muted back" aria-label="Back to articles">←</a>
    <span id="iv-title" class="muted iv-title"></span>
    <button type="button" class="t stage-count" id="iv-stage-btn" aria-expanded="false" aria-controls="iv-menu"><span id="iv-stage-word"></span> ▾</button>
  </header>

  <div class="imenu mono" id="iv-menu" hidden>
    <ul id="iv-stages" aria-label="Stages"></ul>
    <button type="button" class="t muted sendit" id="iv-sendit" aria-expanded="false" aria-controls="iv-sendit-line">send it</button>
    <div class="muted pend" id="iv-sendit-line" hidden></div>
    <p class="err pend" id="iv-menu-error" role="alert" hidden></p>
  </div>

  <main class="iv-page" aria-label="dump.md"><div id="iv-paras" class="paras"></div></main>

  <div class="sheet" id="iv-sheet">
    <div class="sheet-head mono muted">
      <span class="topics" id="iv-topics"></span>
      <button type="button" class="t fold" id="iv-sheet-btn" aria-expanded="true" aria-controls="iv-sheet-body" aria-label="Fold the interview">▾</button>
    </div>
    <div class="sheet-body" id="iv-sheet-body">
      <div class="thread" id="iv-thread" aria-live="polite"></div>
      <div id="iv-queued" class="queued mono muted" hidden></div>
      <div id="iv-note" class="mono err note-line" role="alert" hidden></div>
      <form class="comp" id="iv-form">
        <div id="iv-slash" class="slash mono" role="listbox" aria-label="Commands" hidden></div>
        <label for="iv-composer" class="mono muted prompt">&gt;</label>
        <textarea id="iv-composer" rows="1" aria-label="Answer the coach" aria-controls="iv-slash" aria-autocomplete="list" spellcheck="true"></textarea>
        <button type="submit" class="t mono text send">send</button>
      </form>
    </div>
  </div>
</div>
<script type="module" src="/src/room.ts"></script>
</body>
</html>
