[package]
name = "sparring-desktop"
version = "0.1.0"
description = "Sparring desktop: a thin window onto the daemon on the Mac mini"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
