<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparring</title>
<script src="/theme.js"></script>
</head>
<body>
<div class="sp">
  <header class="bar mono">
    <span>sparring</span>
    <span class="head-right"><span id="head-line" class="muted"></span><button type="button" id="guide-btn" class="hb">guide</button><button type="button" id="theme" class="hb">theme · auto</button></span>
  </header>

  <main>
    <div id="guide-slot" class="guide-slot"></div>
    <form id="idea-form" class="ideaform">
      <label for="idea" class="mono muted">&gt;</label>
      <input id="idea" class="idea" type="text" autocomplete="off" placeholder="an idea in one line · Enter keeps it in the inbox" aria-label="Write down an idea" aria-describedby="idea-error">
    </form>
    <span id="idea-error" class="mono err idea-error" role="alert" hidden></span>

    <section id="inbox-sec" class="list" aria-labelledby="inbox-h" hidden>
      <h2 id="inbox-h" class="mono muted">inbox</h2>
      <div id="inbox"></div>
    </section>

    <hr class="rule">

    <section class="list" aria-labelledby="articles-h">
      <h2 id="articles-h" class="mono muted">articles</h2>
      <div id="articles"></div>
      <p id="empty" class="mono muted" hidden>no articles yet · catch an idea above, or + new article</p>
      <p id="list-error" class="mono err" role="alert"></p>
      <button type="button" id="new-btn" class="t pill">+ new article</button>
      <form id="new" class="slug new" hidden>
        <label for="new-slug" class="help">new article · name it in lowercase words and hyphens · it becomes the folder and the URL</label>
        <div class="slug-row">
          <input id="new-slug" class="mono" name="slug" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="like closed-laptop" aria-describedby="new-error">
          <button type="submit" id="new-go" class="btn primary">create article</button>
          <button type="button" id="new-cancel" class="btn">cancel</button>
        </div>
        <span id="new-error" class="mono err" role="alert"></span>
      </form>
    </section>
  </main>

  <p id="backup" class="mono backup" hidden></p>
  <footer class="bar mono muted">
    <span>j k move · enter open · n new · i idea</span>
    <span id="conn"></span>
  </footer>
</div>
<script type="module" src="/src/index.ts"></script>
</body>
</html>
